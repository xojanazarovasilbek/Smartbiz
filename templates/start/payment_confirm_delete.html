{% extends "start/base.html" %}
{% block title %}Ochirishni tasdiqlash{% endblock %}

{% block content %}
<h1>Tolov yozuvini ochirishni tasdiqlaysizmi?</h1>
<p>{{ payment.student.full_name }} - {{ payment.month|date:"Y-m" }} tolovi rostdan ham ochirilsinmi?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" style="background:#dc2626; margin-top:12px;">Ha, ochirish</button>
</form>
<p style="margin-top:12px;"><a href="{% url 'payment_list' tenant.category.slug tenant.id %}">Bekor qilish</a></p>
{% endblock %}
