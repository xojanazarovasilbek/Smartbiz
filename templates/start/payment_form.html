{% extends "start/base.html" %}
{% block title %}Yangi tolov{% endblock %}

{% block content %}
<h1>Yangi tolov qoshish</h1>

<form method="post">
    {% csrf_token %}
    <label>O'quvchi
        <select name="student" required>
            <option value="">-- tanlang --</option>
            {% for s in students %}
            <option value="{{ s.id }}">{{ s.full_name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Qaysi oy uchun
        <input type="date" name="month" required>
    </label>
    <label>Qaysi kungacha tolash kerak
        <input type="date" name="due_date" required>
    </label>
    <label>Summa (ixtiyoriy)
        <input type="number" name="amount" placeholder="Masalan: 500000">
    </label>
    <label>To'lov turi
        <select name="payment_type">
            <option value="cash">Naqd pul</option>
            <option value="card">Plastik karta</option>
            <option value="click">Click / Payme</option>
            <option value="transfer">Bank otkazma</option>
        </select>
    </label>
    <label>Izoh
        <input type="text" name="note">
    </label>
    <button type="submit" style="margin-top:16px;">Saqlash</button>
</form>

<p style="margin-top:16px;"><a href="{% url 'payment_list' tenant.category.slug tenant.id %}">&larr; Royxatga qaytish</a></p>
{% endblock %}
