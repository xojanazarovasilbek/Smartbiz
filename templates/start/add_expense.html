{% extends "start/base.html" %}
{% block title %}Xarajat qoshish{% endblock %}

{% block content %}
<h1>Yangi xarajat qoshish</h1>

<form method="post">
    {% csrf_token %}
    <label>Nomi
        <input type="text" name="title" required placeholder="Masalan: Ofis ijarasi">
    </label>
    <label>Turi
        <select name="expense_type">
            <option value="rent">Ijara</option>
            <option value="salary">Oylik maosh</option>
            <option value="utilities">Kommunal</option>
            <option value="supplies">Materiallar</option>
            <option value="other" selected>Boshqa</option>
        </select>
    </label>
    <label>Summa
        <input type="number" name="amount" required>
    </label>
    <label>Sana
        <input type="date" name="date">
    </label>
    <label>Izoh
        <input type="text" name="note">
    </label>
    <button type="submit" style="margin-top:16px;">Saqlash</button>
</form>

<p style="margin-top:16px;"><a href="{% url 'financial_report' tenant.category.slug tenant.id %}">&larr; Hisobotga qaytish</a></p>
{% endblock %}
