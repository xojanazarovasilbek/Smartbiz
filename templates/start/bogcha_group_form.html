{% extends "start/base.html" %}
{% block title %}{% if group %}Guruhni tahrirlash{% else %}Yangi guruh{% endif %}{% endblock %}

{% block content %}
<h1>{% if group %}Guruhni tahrirlash{% else %}Yangi guruh qoshish{% endif %}</h1>

<form method="post">
    {% csrf_token %}
    <label>Guruh nomi
        <input type="text" name="name" value="{{ group.name|default:'' }}" required placeholder="Masalan: Kichik guruh">
    </label>
    <label>Tarbiyachi
        <select name="tarbiyachi">
            <option value="">-- tanlanmagan --</option>
            {% for t in teachers %}
            <option value="{{ t.id }}" {% if group and group.tarbiyachi_id == t.id %}selected{% endif %}>{{ t.full_name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Minimal yosh
        <input type="number" name="min_age" value="{{ group.min_age|default:0 }}" required>
    </label>
    <label>Maksimal yosh
        <input type="number" name="max_age" value="{{ group.max_age|default:7 }}" required>
    </label>
    <button type="submit" style="margin-top:16px;">Saqlash</button>
</form>

<p style="margin-top:16px;"><a href="{% url 'bogcha_group_list' tenant.category.slug tenant.id %}">&larr; Royxatga qaytish</a></p>
{% endblock %}
