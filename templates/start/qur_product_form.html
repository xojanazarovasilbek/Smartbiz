{% extends "start/base.html" %}
{% block title %}{% if product %}Mahsulotni tahrirlash{% else %}Yangi mahsulot{% endif %}{% endblock %}

{% block content %}
<h1>{% if product %}Mahsulotni tahrirlash{% else %}Yangi mahsulot qoshish{% endif %}</h1>

<form method="post">
    {% csrf_token %}
    <label>Nomi
        <input type="text" name="name" value="{{ product.name|default:'' }}" required>
    </label>
    <label>Shtrix-kod (ixtiyoriy)
        <input type="text" name="barcode" value="{{ product.barcode|default:'' }}">
    </label>
    <label>Olchov birligi
        <select name="unit">
            {% for value, label in units %}
            <option value="{{ value }}" {% if product and product.unit == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Narxi
        <input type="number" name="price" value="{{ product.price|default:0 }}" required>
    </label>
    <label>Chegirmali narx (ixtiyoriy)
        <input type="number" name="discount_price" value="{{ product.discount_price|default:'' }}">
    </label>
    <label>Joriy qoldiq
        <input type="number" step="0.01" name="quantity" value="{{ product.quantity|default:0 }}" required>
    </label>
    <label>Minimal qoldiq (ogohlantirish uchun)
        <input type="number" step="0.01" name="min_quantity" value="{{ product.min_quantity|default:5 }}">
    </label>
    <button type="submit" style="margin-top:16px;">Saqlash</button>
</form>

<p style="margin-top:16px;"><a href="{% url 'qur_product_list' tenant.category.slug tenant.id category_id %}">&larr; Royxatga qaytish</a></p>
{% endblock %}
