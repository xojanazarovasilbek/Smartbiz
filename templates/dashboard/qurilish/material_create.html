<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangi Qurilish Materialini Qo'shish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-4 sm:p-8 flex justify-center items-center min-h-screen">
    <div class="w-full max-w-md bg-white p-6 rounded-2xl shadow-lg space-y-5">
        <div class="flex justify-between items-center border-b pb-3">
            <h1 class="text-base font-bold text-gray-800">
                <i class="fa-solid fa-boxes-stacked text-amber-600 mr-2"></i> Yangi Material Qo'shish
            </h1>
            <a href="{% url 'qurilish_sites_list' slug tenant_id %}" class="text-xs text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </a>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Material Nomi</label>
                <input type="text" name="name" required placeholder="Masalan: Sement M-400, Armatura 12mm" class="w-full border rounded-xl p-3 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">O'lchov Birligi</label>
                <select name="unit" class="w-full border rounded-xl p-3 text-xs focus:ring-2 focus:ring-amber-500 outline-none bg-white">
                    <option value="kg">Kg (Kilogramm)</option>
                    <option value="tonna">Tonna</option>
                    <option value="dona">Dona</option>
                    <option value="metr">Metr</option>
                    <option value="m3">Kub metr (m³)</option>
                    <option value="qop">Qop</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold text-xs py-3 rounded-xl transition">
                <i class="fa-solid fa-check mr-1"></i> Materialni Saqlash
            </button>
        </form>
    </div>
</body>
</html>
