<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Ishlatish (Chiqim)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-4 sm:p-8 flex justify-center items-center min-h-screen">
    <div class="w-full max-w-lg bg-white p-6 rounded-2xl shadow-lg space-y-5">
        <div class="flex justify-between items-center border-b pb-3">
            <h1 class="text-base font-bold text-gray-800">
                <i class="fa-solid fa-helmet-safety text-amber-600 mr-2"></i> Material Ishlatish (Chiqim)
            </h1>
            <a href="{% url 'qurilish_sites_list' slug|default:'main' tenant_id|default:1 %}" class="text-xs text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </a>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <!-- Ob'yekt -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Qurilish Ob'yekti</label>
                <select name="site_id" required class="w-full border rounded-xl p-3 text-xs focus:ring-2 focus:ring-amber-500 outline-none bg-gray-50">
                    {% for site in sites %}
                        <option value="{{ site.id }}">{{ site.name }}</option>
                    {% empty %}
                        <option value="">Ob'yektlar mavjud emas</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Material -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Material turi</label>
                <select name="material_id" required class="w-full border rounded-xl p-3 text-xs focus:ring-2 focus:ring-amber-500 outline-none bg-gray-50">
                    {% for mat in materials %}
                        <option value="{{ mat.id }}">{{ mat.name }} ({{ mat.get_unit_display }})</option>
                    {% empty %}
                        <option value="">Materiallar mavjud emas</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Miqdori -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Ishlatilgan miqdor</label>
                <input type="number" step="0.01" name="quantity" required placeholder="Masalan: 5" class="w-full border rounded-xl p-3 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
            </div>

            <!-- Qayerga ishlatildi -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Qayerga ishlatildi (Maqsad)</label>
                <input type="text" name="used_for" required placeholder="Masalan: 2-qavat devor suvoqiga" class="w-full border rounded-xl p-3 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
            </div>

            <!-- Sana -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Ishlatilgan sana</label>
                <input type="date" name="date" required class="w-full border rounded-xl p-3 text-xs focus:ring-2 focus:ring-amber-500 outline-none">
            </div>

            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold text-xs py-3 rounded-xl transition">
                <i class="fa-solid fa-check mr-1"></i> Ishlatilganini Saqlash
            </button>
        </form>
    </div>
</body>
</html>
